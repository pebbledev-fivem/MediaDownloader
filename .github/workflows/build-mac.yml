
name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-mac:
    runs-on: macos-15-intel

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "yt-dlp[default]" \
            customtkinter \
            pyinstaller \
            imageio-ffmpeg

      - name: Prepare FFmpeg
        run: |
          mkdir -p binaries
          python - <<'PY'
          import shutil
          import imageio_ffmpeg
          shutil.copy2(
              imageio_ffmpeg.get_ffmpeg_exe(),
              "binaries/ffmpeg"
          )
          PY
          chmod +x binaries/ffmpeg

      - name: Build Mac application
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onedir \
            --windowed \
            --name "MediaDownloader" \
            --collect-all yt_dlp \
            --collect-all customtkinter \
            --add-binary "binaries/ffmpeg:." \
            main.py

      - name: Create ZIP file
        run: |
          cd dist
          ditto -c -k --keepParent \
            MediaDownloader.app \
            MediaDownloader-macOS.zip

      - name: Upload finished application
        uses: actions/upload-artifact@v4
        with:
          name: MediaDownloader-macOS
          path: dist/MediaDownloader-macOS.zip
